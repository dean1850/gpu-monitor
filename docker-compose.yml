# gpu-monitor — see QUICKSTART.md for setup, every setting, and NVIDIA hosts.
# Configuration lives in .env. You should not need to edit this file.
services:
  gpu-monitor:
    image: ghcr.io/dean1850/gpu-monitor:latest
    container_name: gpu-monitor
    restart: unless-stopped
    runtime: ${DOCKER_RUNTIME:-runc}
    pid: host

    ports:
      - "${GPU_MONITOR_PORT:-8088}:8088"

    env_file:
      - path: .env
        required: false

    environment:
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-void}
      NVIDIA_DRIVER_CAPABILITIES: utility,compute,video

    devices:
      - /dev/dri:/dev/dri

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

    cap_add:
      - PERFMON
      - SYS_ADMIN
      - SYS_PTRACE

    security_opt:
      - seccomp:unconfined
